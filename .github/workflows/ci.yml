name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [18, 20, 22]
        exclude:
          - os: windows-latest
            node: 18
          - os: windows-latest
            node: 22
        # arm64 Linux — the closest free approximation of Android/Termux
        # (aarch64), where the global-symlink entry bug was found in the field
        include:
          - os: ubuntu-24.04-arm
            node: 22
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install
        run: npm ci --no-fund --no-audit
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
        env:
          NOIR_PROVIDER: mock
          NOIR_MODEL: mock
      - name: Selftest
        run: node bin/noir.js selftest
        env:
          NOIR_PROVIDER: mock
          NOIR_MODEL: mock
